
name: Daily Shayari Video

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Hindi font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate shayari video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save MP4 for download
        uses: actions/upload-artifact@v4
        with:
          name: shayari-reel
          path: output/
          retention-days: 7  
      - name: Verify Instagram connection
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          params = urllib.parse.urlencode({
              "fields": "id,username",
              "access_token": os.environ["INSTAGRAM_ACCESS_TOKEN"]
          })
          url = "https://graph.instagram.com/me?" + params

          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.loads(response.read().decode())
          except urllib.error.HTTPError as e:
              print("Instagram API returned HTTP status:", e.code)
              raise SystemExit("Instagram connection test failed.")

          print("Instagram username:", data.get("username"))
          print("Instagram account ID:", data.get("id"))
        
          if str(data.get("id")) != os.environ["INSTAGRAM_USER_ID"]:
              raise SystemExit(
                  "The returned account ID does not match INSTAGRAM_USER_ID."
              )

          print("Instagram connection verified successfully.")
          PY
     
      - name: Check available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://generativelanguage.googleapis.com/v1beta/models"
          r = requests.get(
              url,
              headers={"x-goog-api-key": os.environ["GEMINI_API_KEY"]},
              timeout=30
          )
          print("HTTP status:", r.status_code)
          r.raise_for_status()

          for model in r.json().get("models", []):
              if "generateContent" in model.get("supportedGenerationMethods", []):
                  print(model["name"])
          PY
       
      - name: Install Cloudinary package
        run: pip install cloudinary

      - name: Upload video to Cloudinary
        id: cloudinary_upload
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python - <<'PY'
          import os
          import cloudinary
          import cloudinary.uploader

          cloudinary.config(
              cloud_name=os.environ["CLOUDINARY_CLOUD_NAME"],
              api_key=os.environ["CLOUDINARY_API_KEY"],
              api_secret=os.environ["CLOUDINARY_API_SECRET"],
              secure=True,
          )

          result = cloudinary.uploader.upload(
              "output/shayari_reel.mp4",
              resource_type="video",
              folder="shayari-reels",
          )

          url = result["secure_url"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"video_url={url}\n")

          print("Video uploaded successfully.")
          print("Public video URL:", url)
          PY

